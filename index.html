<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Game Editor - ELT Workshop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #3e2723; color: #efebe9; display: flex; padding: 20px; gap: 30px; height: 100vh; margin: 0; box-sizing: border-box; }
        .editor-panel, .preview-panel { background-color: #4e342e; padding: 25px; border-radius: 15px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); }
        .editor-panel { width: 45%; display: flex; flex-direction: column; overflow-y: auto; }
        .preview-panel { width: 55%; display: flex; flex-direction: column; position: relative; padding-bottom: 40px;}
        .editor-panel::-webkit-scrollbar { width: 8px; }
        .editor-panel::-webkit-scrollbar-thumb { background: #795548; border-radius: 4px; }
        
        h1, h2 { color: #ffab00; font-weight: 700; letter-spacing: 1px; font-size: 28px; margin-top: 0; text-align: center; }
        h3 { color: #ffd54f; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #795548; padding-bottom: 5px; margin-top: 25px;}
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: #d7ccc8;}
        .label-with-btn { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        input[type="text"], input[type="url"], select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #795548; background-color: #3e2723; color: #fff; box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 13px; }
        input[type="color"] { padding: 0; border: none; width: 40px; height: 30px; border-radius: 5px; cursor: pointer;}
        input[type="range"] { width: 100%; accent-color: #ffab00; cursor: pointer; }
        textarea { resize: vertical; min-height: 100px; white-space: pre; overflow-wrap: normal; overflow-x: auto;}
        
        .flex-row { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .color-group { display: flex; align-items: center; background: #3e2723; padding: 5px 12px; border-radius: 8px; border: 1px solid #795548; gap: 10px; flex: 1; justify-content: center;}
        
        .upload-btn {
            padding: 4px 10px; font-size: 11px; font-weight: 500;
            background: #3e2723; border: 1px solid #795548; color: #ffd54f;
            border-radius: 5px; cursor: pointer;
        }
        .upload-btn:hover { background: #795548; }

        #previewFrame { width: 100%; flex: 1; border: 2px solid #795548; border-radius: 10px; background-color: #000; }
        button.gen-btn { padding: 15px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; transition: 0.2s; letter-spacing: 1px; text-transform: uppercase;}
        button.gen-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); }
        
        #generated-code { height: 60px; margin-top: 10px; color: #a7d129; font-family: monospace; font-size: 11px;}
        .copyright { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 12px; color: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body>

    <div class="editor-panel">
        <h1>Board Game Editor</h1>
        
        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <label>Язык</label>
                <select id="uiLang" onchange="debounceGenerate()">
                    <option value="EN">English</option><option value="RU">Русский</option><option value="ES">Español</option><option value="FR">Français</option><option value="DE">Deutsch</option><option value="IT">Italiano</option>
                </select>
            </div>
            <div class="form-group" style="flex:1;">
                <label>Макс. кубик</label>
                <select id="maxDice" onchange="debounceGenerate()">
                    <option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
                </select>
            </div>
            <div class="form-group" style="flex:2;">
                <label>Заголовок игры</label>
                <input type="text" id="gameTitle" value="INTO THE WOODS" oninput="debounceGenerate()">
            </div>
        </div>

        <h3>Оформление & Цвета</h3>
        <div class="flex-row">
            <div class="form-group" style="flex:1;"><label>Шрифт</label><select id="fontFamily" onchange="debounceGenerate()"><option value="'Montserrat', sans-serif">Montserrat</option><option value="'Russo One', sans-serif">Russo One</option><option value="'Caveat', cursive">Caveat</option><option value="'Kurale', serif">Kurale</option><option value="'Comfortaa', sans-serif">Comfortaa</option><option value="'Amatic SC', cursive">Amatic SC</option><option value="'Oswald', sans-serif">Oswald</option><option value="'Playfair Display', serif">Playfair Display</option></select></div>
            <div class="form-group"><label>Размер: <span id="fSizeLbl">24</span>px</label><input type="range" id="fontSize" min="14" max="40" value="24" oninput="document.getElementById('fSizeLbl').innerText=this.value; debounceGenerate()"></div>
        </div>
        <div class="flex-row">
            <div class="color-group"><label style="margin:0;">Фон рамки</label><input type="color" id="boardBg" value="#3e2723" onchange="debounceGenerate()"></div>
            <div class="color-group"><label style="margin:0;">Неон рамки</label><input type="color" id="boardNeon" value="#ffab00" onchange="debounceGenerate()"></div>
            <div class="color-group"><label style="margin:0;">Свечение заданий</label><input type="color" id="cellGlow" value="#ffab00" onchange="debounceGenerate()"></div>
        </div>

        <h3>Картинки и Тексты</h3>
        <div class="form-group">
            <div class="label-with-btn"><label>Фон (Background)</label><button class="upload-btn" onclick="document.getElementById('file-bg').click()">Загрузить</button></div>
            <input type="text" id="imgBg" value="https://i.postimg.cc/ZY2Zy5pP/background.jpg" oninput="debounceGenerate()">
        </div>
        <div class="flex-row" style="align-items: flex-start;">
            <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Фишки игроков (<span id="token-counter">1/4</span>)</label><button class="upload-btn" onclick="document.getElementById('file-tokens').click()">Загрузить</button></div>
                <textarea id="imgTokens" rows="4" oninput="debounceGenerate()">https://i.postimg.cc/FF8mJH3S/girl-2.png</textarea>
            </div>
            <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Босс (Клетка 23)</label><button class="upload-btn" onclick="document.getElementById('file-boss').click()">Загрузить</button></div>
                <input type="text" id="imgBoss" value="https://i.postimg.cc/sfqyZg7S/wolf.png" oninput="debounceGenerate()">
            </div>
        </div>
        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Иконка Финиша (На поле)</label><button class="upload-btn" onclick="document.getElementById('file-finish-icon').click()">Загрузить</button></div>
                <input type="text" id="imgFinishIcon" value="https://i.postimg.cc/TPmW9tTP/91c68de4d7df818b1e28a2007835c8a3-fee63876-e1b8-4a69-b853-f25246d834a8-2.png" oninput="debounceGenerate()">
            </div>
            <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Картинка Финиша (Экран)</label><button class="upload-btn" onclick="document.getElementById('file-finish').click()">Загрузить</button></div>
                <input type="text" id="imgFinish" value="https://i.postimg.cc/kMz9tgKY/granny.png" oninput="debounceGenerate()">
            </div>
        </div>
        <div class="flex-row">
            <div class="form-group" style="flex:1;">
                <div class="label-with-btn"><label>Картинка Проигрыша</label><button class="upload-btn" onclick="document.getElementById('file-lose').click()">Загрузить</button></div>
                <input type="text" id="imgLose" value="https://i.postimg.cc/7PdDTZ00/game-over.png" oninput="debounceGenerate()">
            </div>
            <div class="form-group" style="flex:1;"><label>Текст Проигрыша</label><input type="text" id="loseText" value="Game Over! The dinner is served!!" oninput="debounceGenerate()"></div>
        </div>
        <div class="flex-row">
            <div class="form-group" style="flex: 3;"><label>Текст Победы (на финише)</label><input type="text" id="winText" value="You saved the Granny!" oninput="debounceGenerate()"></div>
            <div class="form-group" style="flex: 1;"><label>Цвет фидбека</label><input type="color" id="winColor" value="#ffd700" style="width: 100%;" onchange="debounceGenerate()"></div>
        </div>

        <h3>Задания (Назначаются на рандомные клетки)</h3>
        <div class="form-group"><label>Тип игры на поле</label><select id="gameMode" onchange="toggleTaskInputs(); debounceGenerate()"><option value="quiz">Quiz</option><option value="unscramble">Unscramble</option><option value="fill">Fill in the blank</option><option value="discuss">Discussion</option></select></div>
        <div id="input-quiz"><div class="flex-row" style="align-items: flex-start;"><div class="form-group" style="flex:1;"><label>ВОПРОСЫ</label><textarea id="qList" oninput="debounceGenerate()">He ... playing now.&#10;They ... go to school.&#10;What ... your name?</textarea></div><div class="form-group" style="flex:1.5;"><label>ОТВЕТЫ (Прав | Неправ)</label><textarea id="aList" oninput="debounceGenerate()">is | are | am&#10;don't | doesn't | isn't&#10;is | are | am</textarea></div></div></div>
        <div id="input-simple" style="display:none;"><div class="form-group"><label>Предложения</label><textarea id="simpleList" oninput="debounceGenerate()">I am a student.&#10;She likes reading books.&#10;We went to the park yesterday.</textarea></div></div>
        <div id="input-fill" style="display:none;"><div class="flex-row" style="align-items: flex-start;"><div class="form-group" style="flex:1;"><label>ПРЕДЛОЖЕНИЯ С ПРОПУСКОМ</label><textarea id="fillQList" oninput="debounceGenerate()">He ___ playing now.&#10;They ___ go to school.&#10;What ___ your name?</textarea></div><div class="form-group" style="flex:1;"><label>ПРАВИЛЬНЫЙ ОТВЕТ</label><textarea id="fillAList" oninput="debounceGenerate()">is&#10;don't&#10;is</textarea></div></div></div>

        <h3>Задание для Босса (Клетка 23)</h3>
        <div class="form-group"><label>Тип задания для Босса</label><select id="bossMode" onchange="toggleBossInputs(); debounceGenerate()"><option value="quiz">Quiz</option><option value="unscramble">Unscramble</option><option value="fill">Fill in the blank</option><option value="discuss">Discussion</option></select></div>
        <div class="flex-row">
            <div class="form-group" style="flex:1;"><label id="bossQLabel">Вопрос</label><textarea id="bossQ" rows="2" oninput="debounceGenerate()">The Granny ... waiting for you!</textarea></div>
            <div class="form-group" style="flex:1;" id="bossAGroup"><label id="bossALabel">Ответы (Прав | Неправ)</label><textarea id="bossA" rows="2" oninput="debounceGenerate()">is | are | am</textarea></div>
        </div>
        
        <div class="flex-row" style="margin-top:15px; gap:10px;">
            <button class="gen-btn" onclick="saveProject()" style="flex:1; background: #5d4037; color: #ffd54f; border: 1px solid #795548;">Сохранить проект</button>
            <button class="gen-btn" onclick="document.getElementById('projectFile').click()" style="flex:1; background: #5d4037; color: #ffd54f; border: 1px solid #795548;">Загрузить проект</button>
        </div>
        <div class="flex-row" style="margin-top:10px; gap:10px;">
            <button class="gen-btn" id="downloadHtmlBtn" onclick="downloadHtmlFile()" style="flex:1; background: #2ecc71; color: #fff;">Скачать HTML файл</button>
            <button class="gen-btn" id="copyIframeBtn" onclick="copyIframeCode()" style="flex:1; background: #ffab00; color: #3e2723;">Скопировать iframe</button>
        </div>
        <input type="file" id="projectFile" accept=".json" style="display:none;" onchange="loadProject(event)">
        <textarea id="generated-code" readonly placeholder="Здесь появится готовый код..."></textarea>
    </div>

    <div class="preview-panel">
        <h2>Предпросмотр</h2>
        <iframe id="previewFrame" src="about:blank" frameborder="0" allow="autoplay"></iframe>
        <p class="copyright">©2026 Alina Pogudina @ELT_workshop</p>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="file-bg" accept="image/*" style="display:none;">
    <input type="file" id="file-tokens" accept="image/*" multiple style="display:none;">
    <input type="file" id="file-boss" accept="image/*" style="display:none;">
    <input type="file" id="file-finish-icon" accept="image/*" style="display:none;">
    <input type="file" id="file-finish" accept="image/*" style="display:none;">
    <input type="file" id="file-lose" accept="image/*" style="display:none;">

    <script>
        const MAX_TOKENS = 4;

        // --- Image Upload Logic ---
        function fileToBase64(file, callback) {
            const reader = new FileReader();
            reader.onload = () => callback(reader.result);
            reader.onerror = error => console.error('Error reading file:', error);
            reader.readAsDataURL(file);
        }

        function setupImageUpload(inputId, targetId) {
            document.getElementById(inputId).addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    fileToBase64(file, (base64) => {
                        document.getElementById(targetId).value = base64;
                        debounceGenerate();
                    });
                }
            });
        }
        
        setupImageUpload('file-bg', 'imgBg');
        setupImageUpload('file-boss', 'imgBoss');
        setupImageUpload('file-finish-icon', 'imgFinishIcon');
        setupImageUpload('file-finish', 'imgFinish');
        setupImageUpload('file-lose', 'imgLose');

        document.getElementById('file-tokens').addEventListener('change', (event) => {
            const files = event.target.files;
            const textarea = document.getElementById('imgTokens');
            const currentImages = textarea.value.split('\n').map(s => s.trim()).filter(s => s);
            
            if (currentImages.length + files.length > MAX_TOKENS) {
                alert(`Ошибка: Максимум ${MAX_TOKENS} фишки. Вы пытаетесь добавить ${files.length} к уже имеющимся ${currentImages.length}.`);
                return;
            }

            let processedFiles = 0;
            for (const file of files) {
                fileToBase64(file, (base64) => {
                    const currentText = textarea.value.trim();
                    textarea.value = (currentText ? currentText + '\n' : '') + base64;
                    processedFiles++;
                    if(processedFiles === files.length) {
                         updateTokenCounter();
                         debounceGenerate();
                    }
                });
            }
        });

        function updateTokenCounter() {
            const textarea = document.getElementById('imgTokens');
            const count = textarea.value.split('\n').map(s => s.trim()).filter(s => s).length;
            document.getElementById('token-counter').innerText = `${count}/${MAX_TOKENS}`;
        }
        document.getElementById('imgTokens').addEventListener('input', updateTokenCounter);
        // --- End of Image Upload Logic ---

        function toggleTaskInputs() {
            let mode = document.getElementById('gameMode').value;
            document.getElementById('input-quiz').style.display = mode === 'quiz' ? 'block' : 'none';
            document.getElementById('input-simple').style.display = (mode === 'unscramble' || mode === 'discuss') ? 'block' : 'none';
            document.getElementById('input-fill').style.display = mode === 'fill' ? 'block' : 'none';
        }

        function toggleBossInputs() {
            let bossMode = document.getElementById('bossMode').value;
            let bossAGroup = document.getElementById('bossAGroup');
            let bossQLabel = document.getElementById('bossQLabel');
            let bossALabel = document.getElementById('bossALabel');
            if (bossMode === 'quiz') { bossAGroup.style.display = 'block'; bossQLabel.innerText = 'Вопрос для Босса'; bossALabel.innerText = 'Ответы (Прав | Неправ)'; } 
            else if (bossMode === 'fill') { bossAGroup.style.display = 'block'; bossQLabel.innerText = 'Предложение с пропуском'; bossALabel.innerText = 'Правильный ответ'; } 
            else { bossAGroup.style.display = 'none'; bossQLabel.innerText = (bossMode === 'unscramble') ? 'Предложение для Босса' : 'Вопрос / Тема'; }
        }

        function saveProject() {
            const data = {
                uiLang: document.getElementById('uiLang').value,
                maxDice: document.getElementById('maxDice').value,
                gameTitle: document.getElementById('gameTitle').value,
                fontFamily: document.getElementById('fontFamily').value,
                fontSize: document.getElementById('fontSize').value,
                boardBg: document.getElementById('boardBg').value,
                boardNeon: document.getElementById('boardNeon').value,
                cellGlow: document.getElementById('cellGlow').value,
                imgBg: document.getElementById('imgBg').value,
                imgTokens: document.getElementById('imgTokens').value,
                imgBoss: document.getElementById('imgBoss').value,
                imgFinishIcon: document.getElementById('imgFinishIcon').value,
                imgFinish: document.getElementById('imgFinish').value,
                imgLose: document.getElementById('imgLose').value,
                loseText: document.getElementById('loseText').value,
                winText: document.getElementById('winText').value,
                winColor: document.getElementById('winColor').value,
                gameMode: document.getElementById('gameMode').value,
                qList: document.getElementById('qList').value,
                aList: document.getElementById('aList').value,
                simpleList: document.getElementById('simpleList').value,
                fillQList: document.getElementById('fillQList').value,
                fillAList: document.getElementById('fillAList').value,
                bossMode: document.getElementById('bossMode').value,
                bossQ: document.getElementById('bossQ').value,
                bossA: document.getElementById('bossA').value
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (data.gameTitle.trim() || 'board_game') + '_project.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function loadProject(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.uiLang !== undefined) document.getElementById('uiLang').value = data.uiLang;
                    if (data.maxDice !== undefined) document.getElementById('maxDice').value = data.maxDice;
                    if (data.gameTitle !== undefined) document.getElementById('gameTitle').value = data.gameTitle;
                    if (data.fontFamily !== undefined) document.getElementById('fontFamily').value = data.fontFamily;
                    if (data.fontSize !== undefined) {
                        document.getElementById('fontSize').value = data.fontSize;
                        document.getElementById('fSizeLbl').innerText = data.fontSize;
                    }
                    if (data.boardBg !== undefined) document.getElementById('boardBg').value = data.boardBg;
                    if (data.boardNeon !== undefined) document.getElementById('boardNeon').value = data.boardNeon;
                    if (data.cellGlow !== undefined) document.getElementById('cellGlow').value = data.cellGlow;
                    if (data.imgBg !== undefined) document.getElementById('imgBg').value = data.imgBg;
                    if (data.imgTokens !== undefined) {
                        document.getElementById('imgTokens').value = data.imgTokens;
                        updateTokenCounter();
                    }
                    if (data.imgBoss !== undefined) document.getElementById('imgBoss').value = data.imgBoss;
                    if (data.imgFinishIcon !== undefined) document.getElementById('imgFinishIcon').value = data.imgFinishIcon;
                    if (data.imgFinish !== undefined) document.getElementById('imgFinish').value = data.imgFinish;
                    if (data.imgLose !== undefined) document.getElementById('imgLose').value = data.imgLose;
                    if (data.loseText !== undefined) document.getElementById('loseText').value = data.loseText;
                    if (data.winText !== undefined) document.getElementById('winText').value = data.winText;
                    if (data.winColor !== undefined) document.getElementById('winColor').value = data.winColor;
                    if (data.gameMode !== undefined) {
                        document.getElementById('gameMode').value = data.gameMode;
                        toggleTaskInputs();
                    }
                    if (data.qList !== undefined) document.getElementById('qList').value = data.qList;
                    if (data.aList !== undefined) document.getElementById('aList').value = data.aList;
                    if (data.simpleList !== undefined) document.getElementById('simpleList').value = data.simpleList;
                    if (data.fillQList !== undefined) document.getElementById('fillQList').value = data.fillQList;
                    if (data.fillAList !== undefined) document.getElementById('fillAList').value = data.fillAList;
                    if (data.bossMode !== undefined) {
                        document.getElementById('bossMode').value = data.bossMode;
                        toggleBossInputs();
                    }
                    if (data.bossQ !== undefined) document.getElementById('bossQ').value = data.bossQ;
                    if (data.bossA !== undefined) document.getElementById('bossA').value = data.bossA;

                    debounceGenerate();
                    alert('Проект успешно загружен!');
                } catch (err) {
                    alert('Ошибка при чтении файла проекта: ' + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function downloadHtmlFile() {
            generateCode();
            const htmlContent = document.getElementById('previewFrame').srcdoc;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (document.getElementById('gameTitle').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '_') || 'board_game') + '.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            const btn = document.getElementById('downloadHtmlBtn');
            btn.innerText = 'ФАЙЛ СКАЧАН!';
            setTimeout(() => { btn.innerText = 'Скачать HTML файл'; }, 2000);
        }

        function copyIframeCode() {
            generateCode();
            const htmlCode = document.getElementById('generated-code').value;
            const iframeCode = `<iframe srcdoc="${htmlCode.replace(/"/g, '&quot;')}" width="100%" height="600" frameborder="0" allowfullscreen style="width: 100%; height: 600px; border: none;"></iframe>`;
            
            const tempArea = document.createElement('textarea');
            tempArea.value = iframeCode;
            document.body.appendChild(tempArea);
            tempArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempArea);

            const btn = document.getElementById('copyIframeBtn');
            btn.innerText = 'IFRAME СКОПИРОВАН!';
            setTimeout(() => { btn.innerText = 'Скопировать iframe'; }, 2000);
        }

        function getInputs() {
            let mode = document.getElementById('gameMode').value;
            let tasks = [];
            if(mode === 'quiz') { 
                let q=document.getElementById('qList').value.split('\n').map(s=>s.trim()).filter(s=>s),a=document.getElementById('aList').value.split('\n').map(s=>s.trim()).filter(s=>s); 
                for(let i=0;i<Math.min(q.length,a.length);i++){
                    let p=a[i].split('|').map(s=>s.trim()).filter(s=>s);
                    if(p.length>0)tasks.push({q:q[i],c:p[0],w:p.slice(1)});
                }
            }
            else if (mode==='fill'){
                let q=document.getElementById('fillQList').value.split('\n').map(s=>s.trim()).filter(s=>s),a=document.getElementById('fillAList').value.split('\n').map(s=>s.trim()).filter(s=>s); 
                for(let i=0;i<Math.min(q.length,a.length);i++)tasks.push({q:q[i],c:a[i]});
            }
            else{
                document.getElementById('simpleList').value.split('\n').map(s=>s.trim()).filter(s=>s).forEach(l=>tasks.push({q:l}));
            }
            if(tasks.length===0)tasks=[{q:"No tasks!",c:"Ok",w:[]}];
